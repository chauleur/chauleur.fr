<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Chauleur.fr</title>
  <style>
    body {
      font-family: Avenir, sans-serif;
      background-color: #FFD102;
      text-align: center;
      margin: 0;
    }

    nav {
      background-color: #FFD102;
      position: sticky;
      top: 0;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      margin: 0;
      padding: 0;
    }

    nav li {
      width: 25%;
      text-align: center;
    }

    nav a {
      display: block;
      text-decoration: none;
      color: black;
      padding: 15px 0;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
    }

    nav a:hover {
      color: orange;
      border-bottom: 2px solid gold;
    }

    h1 {
      margin-top: 20px;
    }

    form {
      background: white;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 10px;
    }

    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background-color: orange;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: gold;
    }
  </style>
</head>
<body>

  <nav>
    <ul>
      <li><a href="index.html">Accueil</a></li>
      <li><a href="#">À propos</a></li>

      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  </p>


</body>
</html>
